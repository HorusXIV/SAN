[project]
name = "san"
version = "0.6.0"
description = "Soccer Network Analysis - Network analysis of professional soccer match data"
authors = [
    {name = "Lukas Breiter"},
    {name = "Gian Truttman"},
    {name = "Jessica Schmied"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "notebook (>=7.5.0,<8.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "networkx (>=3.6,<4.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "gensim (>=4.4.0,<5.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.scripts]
# Network generators
san-pass = "src.network_generators.pass_networks:main"
san-match = "src.network_generators.match_networks:main"
san-player-team = "src.network_generators.player_team_networks:main"
san-field = "src.network_generators.field_networks:main"
san-unified = "src.network_generators.unified_pass_network:main"
san-generate-all = "src.network_generators.generate_all:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
